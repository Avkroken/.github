name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the repository Security tab and Report a vulnerability instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, input, or example needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Version, environment, logs, screenshots, or other details that materially help diagnose the problem. Remove secrets and personal data.
