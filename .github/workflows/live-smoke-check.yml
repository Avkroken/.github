name: Live smoke check

on:
  pull_request:
    paths:
      - ".github/workflows/live-smoke-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe denied.se production routes
        shell: bash
        run: |
          set -u

          probe() {
            local label="$1" url="$2"
            local headers body code loc mitigated server
            headers="$(mktemp)"
            body="$(mktemp)"
            curl --silent --show-error --compressed --max-time 20 \
              --output "$body" --dump-header "$headers" \
              --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
              --header "Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8" \
              --header "Accept-Language: sv-SE,sv;q=0.9,en;q=0.7" \
              "$url"
            code="$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' "$headers")"
            loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); x=$0} END{print x}' "$headers")"
            mitigated="$(awk 'BEGIN{IGNORECASE=1} /^cf-mitigated:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$headers")"
            server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$headers")"
            printf '%-36s status=%-4s server=%-12s cf-mitigated=%-12s location=%s\n' "$label" "${code:-ERR}" "${server:-}" "${mitigated:-}" "${loc:-}"
            rm -f "$headers" "$body"
          }

          probe "avkroken root" "https://avkroken.denied.se/"
          probe "avkroken access-denied" "https://avkroken.denied.se/access-denied/"
          probe "avkroken API" "https://avkroken.denied.se/api/sites"

          probe "klarsprak root" "https://klarsprak.denied.se/"
          probe "klarsprak admin" "https://klarsprak.denied.se/admin"
          probe "klarsprak legacy" "https://klarsprak.denied.se/api/admin/queue"

          probe "dumpen root" "https://dumpen.denied.se/"
          probe "dumpen admin" "https://dumpen.denied.se/admin"
          probe "dumpen legacy" "https://dumpen.denied.se/api/objects"

          probe "politiker root" "https://politiker.denied.se/"
          probe "politiker admin" "https://politiker.denied.se/admin"
          probe "politiker legacy" "https://politiker.denied.se/api/admin/accounts"

          probe "produkter root" "https://produkter.denied.se/"
          probe "produkter admin" "https://produkter.denied.se/admin"
          probe "produkter legacy" "https://produkter.denied.se/api/admin/stats"

          probe "skvallerbyttan root" "https://skvallerbyttan.denied.se/"
          probe "skvallerbyttan API" "https://skvallerbyttan.denied.se/api/overview"

          probe "motor health" "https://motor.denied.se/health"
          probe "motor lease" "https://motor.denied.se/jobs/lease"
