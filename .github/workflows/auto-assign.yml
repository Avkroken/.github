name: Auto assign issues and pull requests

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    permissions:
      issues: write
      pull-requests: write
    uses: ./.github/workflows/reusable-auto-assign.yml
    with:
      number: ${{ format('{0}', github.event.issue.number || github.event.pull_request.number) }}
