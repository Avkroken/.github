name: Return failed admission to draft

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  redraft:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Return failed dev pull request to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]] || exit 0
          [[ "$BASE_REF" == "dev" ]] || exit 0

          is_draft="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" == "false" ]]; then
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo
          fi
