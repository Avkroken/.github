name: Central metadata orchestration

on:
  workflow_call:

concurrency:
  group: issue-classification-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues' && (startsWith(github.event.label.name, 'difficulty:') || startsWith(github.event.label.name, 'security:') || startsWith(github.event.label.name, 'classification:'))
    permissions:
      issues: write
    uses: ./.github/workflows/metadata-routing.yml
    with:
      item-kind: issue
      item-number: ${{ github.event.issue.number }}

  pull-request:
    if: github.event_name == 'pull_request_target' && (startsWith(github.event.label.name, 'difficulty:') || startsWith(github.event.label.name, 'security:') || startsWith(github.event.label.name, 'classification:'))
    permissions:
      issues: write
    uses: ./.github/workflows/metadata-routing.yml
    with:
      item-kind: pull_request
      item-number: ${{ github.event.pull_request.number }}

  pull-request-reconcile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: metadata-pr-reconcile-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Reconcile open pull-request owners
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER_ASSIGNEE: blixten85
        shell: bash
        run: |
          set -euo pipefail

          pr_numbers="$(
            gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number'
          )"
          if [[ -z "$pr_numbers" ]]; then
            exit 0
          fi

          mapfile -t prs <<<"$pr_numbers"
          failed=0
          for pr in "${prs[@]}"; do
            if ! gh api --method POST "repos/$REPOSITORY/issues/$pr/assignees" \
              -f "assignees[]=$OWNER_ASSIGNEE" >/dev/null; then
              echo "::error::Failed to reconcile owner for pull request #$pr"
              failed=1
            fi
          done

          exit "$failed"
