name: Apple required

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  bastion:
    name: Bastion Apple
    if: ${{ github.repository == 'Avkroken/Bastion' }}
    uses: Avkroken/.github/.github/workflows/apple.yml@f722cd0c57ca228c78dd604969e9b00cd8bc8f26
    with:
      runner: macos-26
      package_path: App
      xcodegen_spec: App/project.yml
      generation_script: App/generate-project.sh
      project_path: App/Bastion.xcodeproj
      ios_scheme: Bastion
      macos_scheme: Bastion-macOS
      tvos_scheme: Bastion-tvOS

  unsupported:
    name: Unsupported Apple repository
    if: ${{ github.repository != 'Avkroken/Bastion' && github.repository != 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing Apple CI profile
        shell: bash
        run: |
          echo "::error::No Apple CI profile is configured for $GITHUB_REPOSITORY"
          exit 1
