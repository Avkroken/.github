name: Apple reusable

on:
  workflow_call:
    inputs:
      runner:
        description: macOS runner used for Xcode validation.
        required: false
        type: string
        default: macos-26
      package_path:
        description: Optional SwiftPM package path to validate before Xcode generation.
        required: false
        type: string
        default: App
      xcodegen_spec:
        description: XcodeGen spec path relative to the repository root.
        required: false
        type: string
        default: App/project.yml
      generation_script:
        description: Optional project-generation script path. When set, it is used instead of invoking XcodeGen directly.
        required: false
        type: string
        default: ''
      project_path:
        description: Generated Xcode project path relative to the repository root.
        required: true
        type: string
      ios_scheme:
        description: iOS application scheme. Leave empty to skip.
        required: false
        type: string
        default: ''
      macos_scheme:
        description: macOS application scheme. Leave empty to skip.
        required: false
        type: string
        default: ''
      tvos_scheme:
        description: tvOS application scheme. Leave empty to skip.
        required: false
        type: string
        default: ''
      ios_destination:
        required: false
        type: string
        default: generic/platform=iOS Simulator
      macos_destination:
        required: false
        type: string
        default: platform=macOS
      tvos_destination:
        required: false
        type: string
        default: generic/platform=tvOS Simulator

permissions:
  contents: read

jobs:
  applications:
    name: Apple applications
    runs-on: ${{ inputs.runner }}
    env:
      PACKAGE_PATH: ${{ inputs.package_path }}
      XCODEGEN_SPEC: ${{ inputs.xcodegen_spec }}
      GENERATION_SCRIPT: ${{ inputs.generation_script }}
      PROJECT_PATH: ${{ inputs.project_path }}
      IOS_SCHEME: ${{ inputs.ios_scheme }}
      MACOS_SCHEME: ${{ inputs.macos_scheme }}
      TVOS_SCHEME: ${{ inputs.tvos_scheme }}
      IOS_DESTINATION: ${{ inputs.ios_destination }}
      MACOS_DESTINATION: ${{ inputs.macos_destination }}
      TVOS_DESTINATION: ${{ inputs.tvos_destination }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Apple app SwiftPM manifest
        if: ${{ inputs.package_path != '' }}
        run: swift package dump-package --package-path "$PACKAGE_PATH" > /dev/null

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GENERATION_SCRIPT" ]]; then
            sh "$GENERATION_SCRIPT"
          else
            xcodegen generate --spec "$XCODEGEN_SPEC"
          fi

      - name: Build iOS application scheme
        if: ${{ inputs.ios_scheme != '' && steps.generate.outcome == 'success' }}
        run: >
          xcodebuild build
          -skipPackagePluginValidation
          -project "$PROJECT_PATH"
          -scheme "$IOS_SCHEME"
          -destination "$IOS_DESTINATION"
          CODE_SIGNING_ALLOWED=NO

      - name: Build macOS application scheme
        if: ${{ always() && inputs.macos_scheme != '' && steps.generate.outcome == 'success' }}
        run: >
          xcodebuild build
          -skipPackagePluginValidation
          -project "$PROJECT_PATH"
          -scheme "$MACOS_SCHEME"
          -destination "$MACOS_DESTINATION"
          CODE_SIGNING_ALLOWED=NO

      - name: Ensure tvOS runtime
        id: tvos_runtime
        if: ${{ always() && inputs.tvos_scheme != '' && steps.generate.outcome == 'success' }}
        run: xcrun simctl list runtimes available | grep -q tvOS || xcodebuild -downloadPlatform tvOS

      - name: Build tvOS application scheme
        if: ${{ always() && inputs.tvos_scheme != '' && steps.generate.outcome == 'success' && steps.tvos_runtime.outcome == 'success' }}
        run: >
          xcodebuild build
          -skipPackagePluginValidation
          -project "$PROJECT_PATH"
          -scheme "$TVOS_SCHEME"
          -destination "$TVOS_DESTINATION"
          CODE_SIGNING_ALLOWED=NO
