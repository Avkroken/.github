name: Swift required

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  bastion:
    name: Bastion Swift
    if: ${{ github.repository == 'Avkroken/Bastion' }}
    uses: Avkroken/.github/.github/workflows/swift.yml@f722cd0c57ca228c78dd604969e9b00cd8bc8f26
    with:
      package_path: .
      os_matrix: '["ubuntu-latest","macos-latest"]'

  source:
    name: Source repository
    if: ${{ github.repository == 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Source workflow repository; no Swift CI profile required."

  unsupported:
    name: Unsupported Swift repository
    if: ${{ github.repository != 'Avkroken/Bastion' && github.repository != 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing Swift CI profile
        shell: bash
        run: |
          echo "::error::No Swift CI profile is configured for $GITHUB_REPOSITORY"
          exit 1
