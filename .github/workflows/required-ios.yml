name: iOS required

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  bastion:
    name: Bastion iOS
    if: ${{ github.repository == 'Avkroken/Bastion' }}
    uses: ./.github/workflows/xcode.yml
    with:
      platform: ios
      runner: macos-26
      package_path: App
      xcodegen_spec: App/project.yml
      generation_script: App/generate-project.sh
      project_path: App/Bastion.xcodeproj
      scheme: Bastion
      destination: generic/platform=iOS Simulator

  unsupported:
    name: Unsupported iOS repository
    if: ${{ github.repository != 'Avkroken/Bastion' && github.repository != 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing iOS CI profile
        shell: bash
        run: |
          echo "::error::No iOS CI profile is configured for $GITHUB_REPOSITORY"
          exit 1
