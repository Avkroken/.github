name: AI issue classification

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  classify:
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/issue-classification.lock.yml
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
