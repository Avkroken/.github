name: Compile issue classification (temporary)

on:
  push:
    branches:
      - fix/issue-classification-model
    paths:
      - .github/workflows/issue-classification.md
      - .github/workflows/compile-issue-classification-temp.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify gh-aw v0.87.10
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.87.10/linux-amd64 -o /tmp/gh-aw
          echo "1624fb3a6e93b48046377c7b26c9b326e2b25056b3f36cc3fd3bf0ebee7d59fd  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile workflow source
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gh-aw compile .github/workflows/issue-classification.md

      - name: Stage generated files on branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ghaw-output
          cp .github/workflows/issue-classification.md .ghaw-output/issue-classification.md
          cp .github/workflows/issue-classification.lock.yml .ghaw-output/issue-classification.lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ghaw-output/issue-classification.md .ghaw-output/issue-classification.lock.yml
          git commit -m "chore: stage generated issue classification workflow"
          git push origin HEAD:fix/issue-classification-model
