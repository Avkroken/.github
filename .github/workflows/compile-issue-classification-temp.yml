name: Compile issue classification (temporary)

on:
  push:
    branches:
      - fix/issue-classification-model

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify gh-aw v0.87.10
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.87.10/linux-amd64 -o /tmp/gh-aw
          echo "1624fb3a6e93b48046377c7b26c9b326e2b25056b3f36cc3fd3bf0ebee7d59fd  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile workflow source
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gh-aw compile .github/workflows/issue-classification.md

      - name: Upload generated source and lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-classification-compiled
          path: |
            .github/workflows/issue-classification.md
            .github/workflows/issue-classification.lock.yml
          if-no-files-found: error
