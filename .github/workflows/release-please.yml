name: Release Please

on:
  workflow_call:
    inputs:
      config-file:
        description: Release Please manifest configuration in the caller repository.
        required: false
        default: release-please-config.json
        type: string
      manifest-file:
        description: Release Please version manifest in the caller repository.
        required: false
        default: .release-please-manifest.json
        type: string
      components-file:
        description: Optional declarative first-party component inventory.
        required: false
        default: .github/release-components.json
        type: string
    secrets:
      app-private-key:
        description: GitHub App private key.
        required: true

permissions: {}

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create repository-scoped Gamnacken token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GAMNACKEN_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release contract
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(os.environ["CONFIG_FILE"])
          manifest_path = Path(os.environ["MANIFEST_FILE"])
          for path in (config_path, manifest_path):
              if not path.is_file():
                  raise SystemExit(f"missing release file: {path}")

          config = json.loads(config_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          if config.get("draft") is not True:
              raise SystemExit("release config must set draft=true")
          if config.get("force-tag-creation") is not True:
              raise SystemExit("release config must set force-tag-creation=true")
          if config.get("include-v-in-tag", True) is not True:
              raise SystemExit("release config must use v-prefixed stable tags")

          packages = config.get("packages")
          if not isinstance(packages, dict) or set(packages) != {"."}:
              raise SystemExit("central release workflow currently supports exactly one root release package")
          if set(manifest) != {"."}:
              raise SystemExit("release manifest must contain exactly the root package")
          PY

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Arm native auto-merge for release pull request
        if: ${{ steps.release.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            read -r base head sha draft < <(
              gh pr view "$pr" --repo "$GH_REPO" \
                --json baseRefName,headRefName,headRefOid,isDraft \
                --jq '[.baseRefName,.headRefName,.headRefOid,(.isDraft|tostring)] | @tsv'
            )
            if [[ "$base" != "main" || "$head" != release-please--* || "$draft" != "false" ]]; then
              echo "::error::Refusing to arm unexpected release pull request #$pr"
              exit 1
            fi
            gh pr merge "$pr" --repo "$GH_REPO" --auto --match-head-commit "$sha"
          done < <(jq -r '.[].number' <<< "$RELEASE_PRS")

      - name: Build final release notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          COMPONENTS_FILE: ${{ inputs.components-file }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"

          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release Please must create a draft release so notes can be finalized before publication."
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body --jq '.body' > "$RUNNER_TEMP/release-body.md"
          gh api "repos/$GH_REPO/tags?per_page=100" > "$RUNNER_TEMP/tags.json"

          previous_tag="$(python3 - "$RUNNER_TEMP/tags.json" "$RELEASE_TAG" <<'PY'
          import json
          import re
          import sys

          tags = json.load(open(sys.argv[1]))
          current = sys.argv[2]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", current)
          if not match:
              raise SystemExit(0)
          cur = tuple(map(int, match.groups()))
          versions = []
          for item in tags:
              found = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", item.get("name", ""))
              if found:
                  version = tuple(map(int, found.groups()))
                  if version < cur:
                      versions.append((version, item["name"]))
          if versions:
              print(max(versions)[1])
          PY
          )"

          if [[ -n "$previous_tag" ]]; then
            gh api "repos/$GH_REPO/compare/$previous_tag...$RELEASE_TAG" > "$RUNNER_TEMP/compare.json"
          else
            printf '{"commits":[]}' > "$RUNNER_TEMP/compare.json"
          fi

          python3 - "$RUNNER_TEMP/release-body.md" "$RUNNER_TEMP/compare.json" "$COMPONENTS_FILE" "$RELEASE_TAG" "$RUNNER_TEMP/final-release-notes.md" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          import tomllib

          body_path, compare_path, components_path, release_tag, output_path = map(Path, sys.argv[1:])
          release_tag = str(release_tag)
          body = body_path.read_text().rstrip()
          compare = json.loads(compare_path.read_text())

          dependency_pattern = re.compile(
              r"^(?:(?:chore|build)\((?:deps|deps-dev)\):|deps(?:\([^)]*\))?:)",
              re.IGNORECASE,
          )
          dependencies = []
          for commit in compare.get("commits", []):
              subject = commit.get("commit", {}).get("message", "").splitlines()[0].strip()
              if subject and dependency_pattern.match(subject) and subject not in dependencies:
                  dependencies.append(subject)

          sections = []
          if dependencies:
              visible = dependencies[:20]
              lines = ["## Dependency updates", ""] + [f"- {line}" for line in visible]
              if len(dependencies) > len(visible):
                  lines.append(f"- … and {len(dependencies) - len(visible)} more dependency updates")
              sections.append("\n".join(lines))

          config_file = Path(components_path)
          if config_file.is_file():
              config = json.loads(config_file.read_text())
              components = config.get("components", [])
              if not isinstance(components, list) or len(components) > 12:
                  raise SystemExit("components must be a list with at most 12 entries")

              rows = []
              root = Path.cwd().resolve()

              def nested(data, key):
                  value = data
                  for part in key.split("."):
                      if not isinstance(value, dict) or part not in value:
                          raise KeyError(key)
                      value = value[part]
                  return value

              for item in components:
                  if not isinstance(item, dict):
                      raise SystemExit("invalid component entry")
                  name = str(item.get("name", "")).strip()
                  source = item.get("source")
                  if not name or len(name) > 80:
                      raise SystemExit("component name must be 1-80 characters")

                  if source == "release":
                      version = release_tag
                  elif source in {"json", "toml"}:
                      rel = Path(str(item.get("path", "")))
                      candidate = (root / rel).resolve()
                      if not rel.as_posix() or root not in candidate.parents:
                          raise SystemExit(f"invalid component path for {name}")
                      key = str(item.get("key", "")).strip()
                      if not key:
                          raise SystemExit(f"missing component key for {name}")
                      if source == "json":
                          data = json.loads(candidate.read_text())
                      else:
                          with candidate.open("rb") as handle:
                              data = tomllib.load(handle)
                      version = nested(data, key)
                  else:
                      raise SystemExit(f"unsupported component source for {name}")

                  version = str(version).strip()
                  if not version or len(version) > 80 or "\n" in version:
                      raise SystemExit(f"invalid version for {name}")
                  rows.append((name.replace("|", "\\|"), version.replace("|", "\\|")))

              if rows:
                  lines = ["## Program versions", "", "| Program | Version |", "| --- | --- |"]
                  lines.extend(f"| {name} | {version} |" for name, version in rows)
                  sections.append("\n".join(lines))

          final = body
          if sections:
              final += "\n\n" + "\n\n".join(sections)
          Path(output_path).write_text(final.rstrip() + "\n")
          PY

      - name: Publish finalized release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --notes-file "$RUNNER_TEMP/final-release-notes.md" \
            --draft=false
