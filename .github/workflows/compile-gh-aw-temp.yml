name: Temporary gh-aw compile

on:
  push:
    branches:
      - fix/issue-triage-external-actors

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified gh-aw v0.87.10
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/gh-aw" https://github.com/github/gh-aw/releases/download/v0.87.10/linux-amd64
          echo '1624fb3a6e93b48046377c7b26c9b326e2b25056b3f36cc3fd3bf0ebee7d59fd  '"$RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version

      - name: Compile and verify issue classification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile issue-classification --strict --no-check-update
          test -s .github/workflows/issue-classification.lock.yml
          ! grep -q 'GH_AW_REQUIRED_ROLES' .github/workflows/issue-classification.lock.yml
          ! grep -q 'check_membership.cjs' .github/workflows/issue-classification.lock.yml

      - name: Commit generated lock and remove temporary compiler workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/issue-classification.lock.yml .github/workflows/issue-classification.md
          git rm .github/workflows/compile-gh-aw-temp.yml
          git commit -m 'fix: compile all-actors issue triage'
          git push origin HEAD:fix/issue-triage-external-actors
