name: Agent auto-merge

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  agent-auto-merge:
    permissions:
      checks: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/agent-automerge-policy.yml
