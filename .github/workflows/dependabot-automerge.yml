name: Dependabot merge queue

on:
  workflow_call:
    secrets:
      app-private-key:
        description: GitHub App private key.
        required: true

permissions: {}

concurrency:
  group: dependabot-queue-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create repository-scoped Gamnacken token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GAMNACKEN_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Reconcile Dependabot pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          repo_owner="${GH_REPO%%/*}"
          repo_name="${GH_REPO#*/}"
          conflict_marker='<!-- avkroken-dependabot-queue-conflict -->'

          mapfile -t prs < <(
            gh pr list --repo "$GH_REPO" --state open --app dependabot --limit 100 \
              --json number,isDraft,headRefOid \
              --jq '.[] | select(.isDraft == false) | [.number, .headRefOid] | @tsv'
          )

          for row in "${prs[@]}"; do
            IFS=$'\t' read -r pr head_sha <<< "$row"

            read -r pr_id mergeable merge_state auto_method < <(
              gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){id mergeable mergeStateStatus autoMergeRequest{mergeMethod}}}}}' \
                -f owner="$repo_owner" \
                -f name="$repo_name" \
                -F number="$pr" \
                --jq '[.data.repository.pullRequest.id, .data.repository.pullRequest.mergeable, .data.repository.pullRequest.mergeStateStatus, (.data.repository.pullRequest.autoMergeRequest.mergeMethod // "")] | @tsv'
            )

            if [[ -n "$auto_method" && "$auto_method" != "SQUASH" ]]; then
              echo "::warning title=Dependabot merge queue::PR #${pr} had stale auto-merge method ${auto_method}; resetting it to SQUASH."
              gh api graphql \
                -f query='mutation($pullRequestId:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId}){pullRequest{id}}}' \
                -f pullRequestId="$pr_id" \
                >/dev/null
            fi

            conflict_comment_id="$(
              gh api --paginate "repos/$GH_REPO/issues/$pr/comments" \
                --jq ".[] | select(.body | contains(\"$conflict_marker\")) | .id" \
                | head -n1
            )"

            if [[ "$merge_state" == "DIRTY" ]]; then
              conflict_body="$(cat <<EOF
          $conflict_marker
          Status: **active**

          Dependabot merge-queue reconciliation detected a real merge conflict on this pull request.

          - HEAD: \`$head_sha\`
          - GitHub \`mergeStateStatus\`: \`DIRTY\`
          - Normal \`BEHIND\` state is handled by merge queue; \`DIRTY\` requires conflict resolution.

          Automation intentionally does **not** update or rebase Dependabot branches. Resolve the conflict through Dependabot or an owner action; the scheduled reconciliation will retry native squash auto-merge afterward.
          EOF
              )"

              if [[ -n "$conflict_comment_id" ]]; then
                gh api --method PATCH "repos/$GH_REPO/issues/comments/$conflict_comment_id" \
                  -f "body=$conflict_body" >/dev/null
              else
                gh api --method POST "repos/$GH_REPO/issues/$pr/comments" \
                  -f "body=$conflict_body" >/dev/null
              fi
            elif [[ -n "$conflict_comment_id" ]]; then
              current_conflict_body="$(
                gh api "repos/$GH_REPO/issues/comments/$conflict_comment_id" --jq '.body'
              )"
              if grep -Fq 'Status: **active**' <<< "$current_conflict_body"; then
                resolved_body="$(cat <<EOF
          $conflict_marker
          Status: **resolved**

          The latest Dependabot merge-queue reconciliation no longer reports a merge conflict.

          - HEAD: \`$head_sha\`
          - GitHub \`mergeStateStatus\`: \`$merge_state\`

          Native squash auto-merge reconciliation continues normally.
          EOF
                )"
                gh api --method PATCH "repos/$GH_REPO/issues/comments/$conflict_comment_id" \
                  -f "body=$resolved_body" >/dev/null
              fi
            fi

            if ! output="$(gh pr merge "$pr" --repo "$GH_REPO" --auto --squash --match-head-commit "$head_sha" 2>&1)"; then
              output="${output//$'\n'/ }"
              echo "::warning title=Dependabot merge queue::Could not arm or enqueue PR #${pr} with SQUASH (mergeable=${mergeable}, mergeStateStatus=${merge_state}). ${output} A later reconciliation will retry without changing the PR branch."
            fi
          done
