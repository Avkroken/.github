name: Dependabot merge queue

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID used to request a repository-scoped installation token.
        required: true
        type: string
    secrets:
      app-private-key:
        description: GitHub App private key.
        required: true

permissions: {}

concurrency:
  group: dependabot-queue-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create repository-scoped Gamnacken token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile Dependabot pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u -o pipefail

          mapfile -t prs < <(
            gh pr list --repo "$GH_REPO" --state open --app dependabot --limit 100 \
              --json number,isDraft,headRefOid \
              --jq '.[] | select(.isDraft == false) | [.number, .headRefOid] | @tsv'
          )

          for row in "${prs[@]}"; do
            IFS=$'\t' read -r pr head_sha <<< "$row"

            if ! gh pr merge "$pr" --repo "$GH_REPO" --auto --match-head-commit "$head_sha"; then
              echo "::warning title=Dependabot merge queue::Could not arm or enqueue PR #${pr}; a later reconciliation will retry."
            fi
          done
