name: Reusable auto assign

on:
  workflow_call:
    inputs:
      number:
        description: Issue or pull request number in the caller repository.
        required: true
        type: number
      assignee:
        description: GitHub username to assign.
        required: false
        type: string
        default: blixten85

permissions:
  issues: write

jobs:
  assign:
    name: Assign owner
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue or pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.number }}
          ASSIGNEE: ${{ inputs.assignee }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid issue or pull request number."
            exit 1
          fi

          if [[ -z "$ASSIGNEE" ]]; then
            echo "::error::Assignee must not be empty."
            exit 1
          fi

          jq -cn --arg assignee "$ASSIGNEE" '{assignees: [$assignee]}' |
            gh api               --method POST               --header "Accept: application/vnd.github+json"               "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees"               --input -               >/dev/null
