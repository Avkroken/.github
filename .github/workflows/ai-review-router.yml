name: AI review router

on:
  pull_request:
    paths:
      - .github/workflows/ai-review-router.yml
      - .github/scripts/ai-review-router.sh
      - .github/scripts/ai-review-router.test.sh
      - .github/scripts/deep-coderabbit-gate.sh
      - .github/scripts/deep-coderabbit-gate.test.sh
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository filter for a manual run
        required: false
        type: string
      dry_run:
        description: Show routing decisions without creating labels or requesting reviews
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out router change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n .github/scripts/ai-review-router.sh
          bash -n .github/scripts/ai-review-router.test.sh
          bash -n .github/scripts/deep-coderabbit-gate.sh
          bash -n .github/scripts/deep-coderabbit-gate.test.sh

      - name: Run router tests
        shell: bash
        run: |
          bash .github/scripts/ai-review-router.test.sh
          bash .github/scripts/deep-coderabbit-gate.test.sh

  route:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: central-ai-review-router
      cancel-in-progress: false
    steps:
      - name: Check out trusted router code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Create organization-scoped Gamnacken token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GAMNACKEN_CLIENT_ID }}
          private-key: ${{ secrets.GAMNACKEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-pull-requests: write

      - name: Reconcile deep CodeRabbit gates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY_FILTER: ${{ inputs.repository || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: bash .github/scripts/deep-coderabbit-gate.sh

      - name: Route advisory AI reviews
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ROUTED_AUTHOR: blixten85
          REPOSITORY_FILTER: ${{ inputs.repository || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REVIEW_RESPONSE_TIMEOUT_SECONDS: 120
          REVIEW_RESPONSE_POLL_SECONDS: 15
        shell: bash
        run: bash .github/scripts/ai-review-router.sh
