name: AI review router

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository filter for a manual run
        required: false
        type: string
      dry_run:
        description: Show routing decisions without creating labels or requesting reviews
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: central-ai-review-router
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted router code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Create organization-scoped Gamnacken token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GAMNACKEN_CLIENT_ID }}
          private-key: ${{ secrets.GAMNACKEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-pull-requests: write

      - name: Route advisory AI reviews
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          ROUTED_AUTHOR: blixten85
          REPOSITORY_FILTER: ${{ inputs.repository || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: bash .github/scripts/ai-review-router.sh
