name: Xcode reusable

on:
  workflow_call:
    inputs:
      platform:
        description: Platform identifier: ios, macos, or tvos.
        required: true
        type: string
      runner:
        description: macOS runner used for Xcode validation.
        required: false
        type: string
        default: macos-26
      package_path:
        description: Optional SwiftPM package path to validate before Xcode generation.
        required: false
        type: string
        default: App
      xcodegen_spec:
        description: XcodeGen spec path relative to the repository root.
        required: false
        type: string
        default: App/project.yml
      generation_script:
        description: Optional project-generation script path. When set, it is used instead of invoking XcodeGen directly.
        required: false
        type: string
        default: ''
      project_path:
        description: Generated Xcode project path relative to the repository root.
        required: true
        type: string
      scheme:
        description: Xcode scheme to build.
        required: true
        type: string
      destination:
        description: xcodebuild destination.
        required: true
        type: string

permissions:
  contents: read

jobs:
  application:
    name: Xcode application
    runs-on: ${{ inputs.runner }}
    env:
      PLATFORM: ${{ inputs.platform }}
      PACKAGE_PATH: ${{ inputs.package_path }}
      XCODEGEN_SPEC: ${{ inputs.xcodegen_spec }}
      GENERATION_SCRIPT: ${{ inputs.generation_script }}
      PROJECT_PATH: ${{ inputs.project_path }}
      SCHEME: ${{ inputs.scheme }}
      DESTINATION: ${{ inputs.destination }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate platform input
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios|macos|tvos) ;;
            *)
              echo "::error::Unsupported Xcode platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Validate Apple app SwiftPM manifest
        if: ${{ inputs.package_path != '' }}
        run: swift package dump-package --package-path "$PACKAGE_PATH" > /dev/null

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GENERATION_SCRIPT" ]]; then
            sh "$GENERATION_SCRIPT"
          else
            xcodegen generate --spec "$XCODEGEN_SPEC"
          fi

      - name: Ensure tvOS runtime
        if: ${{ inputs.platform == 'tvos' }}
        run: xcrun simctl list runtimes available | grep -q tvOS || xcodebuild -downloadPlatform tvOS

      - name: Build application scheme
        run: >
          xcodebuild build
          -skipPackagePluginValidation
          -project "$PROJECT_PATH"
          -scheme "$SCHEME"
          -destination "$DESTINATION"
          CODE_SIGNING_ALLOWED=NO
