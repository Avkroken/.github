name: Node

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run repository Node CI
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            Avkroken/.github)
              echo "Source workflow repository; no Node CI profile required."
              ;;

            Avkroken/Klarsprak)
              npm install --ignore-scripts --no-audit --no-fund
              npm test
              ;;

            Avkroken/Dumpen)
              npm ci
              npm test
              ;;

            Avkroken/Skvallerbyttan)
              npm ci
              npm test
              npm run typecheck
              ;;

            Avkroken/Krosa-Maja)
              npm ci
              npm test
              npm run typecheck
              ;;

            Avkroken/Politiker)
              (
                cd app
                npm ci
                npm test
                npm run typecheck
              )
              ;;

            Avkroken/Produkter)
              (
                cd cloudflare/app
                npm ci
                npm test
                npm run typecheck
              )
              (
                cd cloudflare/engine
                npm ci
                npm run typecheck
              )
              (
                cd cloudflare/processor
                npm ci
                npx tsc --noEmit
              )
              ;;

            *)
              echo "::error::No Node CI profile configured for $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac
