name: Dependency review

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
          # Bastion's AGP 9.4.1 buildscript requests Bouncy Castle 1.80.2, but
          # Android/build.gradle.kts forces the resolved build-tool classpath to
          # 1.86. GitHub's snapshot diff can still report the requested 1.80.2
          # nodes when base/head snapshot sets differ. Allow only the three
          # advisories currently attached to that false-positive requested
          # version; every other advisory and dependency remains blocking.
          allow-ghsas: ${{ github.repository == 'Avkroken/Bastion' && 'GHSA-9pwp-9qqc-pr26,GHSA-qp49-qgx5-5m26,GHSA-c3fc-8qff-9hwx' || '' }}
