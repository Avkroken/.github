name: Compile agentic issue triage

on:
  push:
    branches:
      - chore/agentic-issue-triage
    paths:
      - .github/workflows/issue-classification.md
      - .github/workflows/compile-agentic-triage.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@ff62cdbec36230acbae869ddb28806e8eca01ea1
        with:
          version: v0.87.10

      - name: Compile workflow
        run: gh aw compile .github/workflows/issue-classification.md

      - name: Commit compiled lockfile
        run: |
          set -euo pipefail
          git add .github/workflows/issue-classification.lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: compile agentic issue classification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
