name: .NET required

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  bastion:
    name: Bastion .NET
    if: ${{ github.repository == 'Avkroken/Bastion' }}
    uses: ./.github/workflows/dotnet.yml
    with:
      dotnet_version: 10.0.x
      test_working_directory: WindowsApp/Bastion.Core.Tests
      application_project: WindowsApp/WindowsApp.csproj
      install_openssh: true

  source:
    name: Source repository
    if: ${{ github.repository == 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Source workflow repository; no .NET CI profile required."

  unsupported:
    name: Unsupported .NET repository
    if: ${{ github.repository != 'Avkroken/Bastion' && github.repository != 'Avkroken/.github' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing .NET CI profile
        shell: bash
        run: |
          echo "::error::No .NET CI profile is configured for $GITHUB_REPOSITORY"
          exit 1
