# Compatibility filename retained for existing pinned callers. This is a normal
# deterministic reusable workflow; it is not generated by gh-aw.
name: Deterministic issue classification

on:
  workflow_call:

permissions: {}

jobs:
  classify:
    name: Classify issue metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Classify triggering issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ITEM_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ITEM_NUMBER" || "$ITEM_NUMBER" == "null" ]]; then
            echo "This workflow requires an issues event" >&2
            exit 1
          fi

          issue_json="$(gh api "repos/$REPOSITORY/issues/$ITEM_NUMBER")"
          title="$(jq -r '.title // ""' <<<"$issue_json")"
          body="$(jq -r '.body // ""' <<<"$issue_json")"
          text="$(printf '%s\n%s\n' "$title" "$body" | tr '[:upper:]' '[:lower:]')"
          text_length="${#text}"

          difficulty="medium"
          if (( text_length > 12000 )) || grep -Eqi \
            '(^|[^a-z])(architecture|architectural|migration|migrate|cross[- ]repo|multi[- ]repo|concurren(t|cy)|race condition|deadlock|database schema|schema migration|breaking change|redesign|rewrite|platform-wide|organization-wide|org-wide)([^a-z]|$)' \
            <<<"$text"; then
            difficulty="high"
          elif (( text_length <= 4000 )) && grep -Eqi \
            '(^|[^a-z])(readme|documentation|docs|typo|spelling|wording|copy|clarif(y|ication)|rename|changelog|comment)([^a-z]|$)' \
            <<<"$text"; then
            difficulty="low"
          fi

          security="none"
          if grep -Eqi \
            '(^|[^a-z])(private key|secret exposure|secret exposed|credential leak|credentials leaked|token leaked|token exposed|remote code execution|rce|authentication bypass|auth bypass|account takeover|sql injection)([^a-z]|$)' \
            <<<"$text"; then
            security="critical"
          elif grep -Eqi \
            '(^|[^a-z])(password|secret scanning|vulnerability|cve-[0-9]|privilege escalation|path traversal|ssrf|csrf|cross[- ]site scripting|xss|command injection|unauthorized access)([^a-z]|$)' \
            <<<"$text"; then
            security="high"
          elif grep -Eqi \
            '(^|[^a-z])(security|permission|permissions|authorization|authentication|credential|credentials|secret|token)([^a-z]|$)' \
            <<<"$text"; then
            security="medium"
          elif grep -Eqi \
            '(^|[^a-z])(hardening|defense in depth|defence in depth|security header|content security policy|csp)([^a-z]|$)' \
            <<<"$text"; then
            security="low"
          fi

          classification="classification:$difficulty:$security"

          mapfile -t current_labels < <(jq -r '.labels[].name' <<<"$issue_json")
          for label in "${current_labels[@]}"; do
            if [[ "$label" == classification:* ]]; then
              gh api --method DELETE \
                "repos/$REPOSITORY/issues/$ITEM_NUMBER/labels/$label" >/dev/null
            fi
          done

          if ! gh label create "$classification" \
            --repo "$REPOSITORY" \
            --color "D4C5F9" \
            --description "Temporary deterministic issue classification"; then
            if ! gh label list --repo "$REPOSITORY" --limit 1000 --json name --jq '.[].name' \
              | grep -Fxq "$classification"; then
              echo "Failed to ensure classification label: $classification" >&2
              exit 1
            fi
          fi

          gh api --method POST \
            "repos/$REPOSITORY/issues/$ITEM_NUMBER/labels" \
            -f "labels[]=$classification" \
            >/dev/null

          echo "Classification: $classification"
