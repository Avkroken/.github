name: Reconcile central reusable workflow pins

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: central-reusable-workflow-pin-reconciliation
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Discover latest commit for each workflow family
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          latest_for_path() {
            local path="$1"
            gh api --method GET "repos/$GH_REPO/commits" \
              -f "path=$path" \
              -f "sha=main" \
              -f "per_page=1" \
              --jq '.[0].sha'
          }

          newer_of() {
            local first="$1"
            local second="$2"
            local status

            if [[ "$first" == "$second" ]]; then
              printf '%s\n' "$first"
              return
            fi

            status="$(gh api "repos/$GH_REPO/compare/$first...$second" --jq '.status')"
            case "$status" in
              ahead)
                printf '%s\n' "$second"
                ;;
              behind)
                printf '%s\n' "$first"
                ;;
              identical)
                printf '%s\n' "$first"
                ;;
              *)
                echo "::error::Workflow-family commits are not linearly ordered: $first vs $second ($status)."
                exit 1
                ;;
            esac
          }

          routing_sha="$(latest_for_path .github/workflows/metadata-routing.yml)"
          orchestration_sha="$(latest_for_path .github/workflows/metadata-orchestration.yml)"
          orchestration_sha="$(newer_of "$orchestration_sha" "$routing_sha")"
          classification_sha="$(latest_for_path .github/workflows/issue-classification.lock.yml)"
          dependabot_sha="$(latest_for_path .github/workflows/dependabot-automerge.yml)"
          release_sha="$(latest_for_path .github/workflows/release-please.yml)"

          matrix="$(
            jq -cn \
              --arg orchestration "$orchestration_sha" \
              --arg routing "$routing_sha" \
              --arg classification "$classification_sha" \
              --arg dependabot "$dependabot_sha" \
              --arg release "$release_sha" \
              '{include:[
                {scope:"metadata-orchestration",target_sha:$orchestration},
                {scope:"metadata-routing",target_sha:$routing},
                {scope:"classification",target_sha:$classification},
                {scope:"dependabot",target_sha:$dependabot},
                {scope:"release",target_sha:$release}
              ]}'
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Dispatch pin reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCOPE: ${{ matrix.scope }}
          TARGET_SHA: ${{ matrix.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-reusable-workflow-pins.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f "scope=$SCOPE" \
            -f "target_sha=$TARGET_SHA"
