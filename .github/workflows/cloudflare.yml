name: Cloudflare

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce Cloudflare cost guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          MAX_LOG_SAMPLE = 0.10
          MAX_TRACE_SAMPLE = 0.01

          def strip_jsonc(text):
              out = []
              i = 0
              in_string = False
              escape = False
              line_comment = False
              block_comment = False

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False
                          out.append(c)
                      i += 1
                      continue

                  if block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if in_string:
                      out.append(c)
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if c == '"':
                      in_string = True
                      out.append(c)
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  out.append(c)
                  i += 1

              return re.sub(r",\s*([}\]])", r"\1", "".join(out))

          def as_rate(value, fallback):
              if value is None:
                  value = fallback
              if not isinstance(value, (int, float)):
                  raise ValueError(f"sampling rate must be numeric, got {value!r}")
              return float(value)

          def check_observability(path, label, obs):
              errors = []
              prefix = f"{path} ({label})"

              if not isinstance(obs, dict):
                  return [f"{prefix}: observability must be configured"]

              if obs.get("enabled") is not True:
                  errors.append(f"{prefix}: observability.enabled must be true")

              if config.get("tail_consumers"):
                  errors.append(
                      f"{path}: tail_consumers are not allowed in the free-first Cloudflare profile"
                  )

              if obs.get("redact_query_string") is not True:
                  errors.append(f"{prefix}: redact_query_string must be true")

              top_rate = as_rate(obs.get("head_sampling_rate"), 1)
              if not 0 <= top_rate <= MAX_LOG_SAMPLE:
                  errors.append(
                      f"{prefix}: observability.head_sampling_rate={top_rate} exceeds {MAX_LOG_SAMPLE}"
                  )

              logs = obs.get("logs")
              if not isinstance(logs, dict) or logs.get("enabled") is not True:
                  errors.append(f"{prefix}: persistent Workers Logs must be enabled")
              else:
                  if logs.get("persist") is not True:
                      errors.append(f"{prefix}: logs.persist must be true")
                  if logs.get("invocation_logs") is not True:
                      errors.append(f"{prefix}: logs.invocation_logs must be true")
                  log_rate = as_rate(logs.get("head_sampling_rate"), top_rate)
                  if not 0 <= log_rate <= MAX_LOG_SAMPLE:
                      errors.append(
                          f"{prefix}: logs.head_sampling_rate={log_rate} exceeds {MAX_LOG_SAMPLE}"
                      )
                  if logs.get("destinations"):
                      errors.append(
                          f"{prefix}: external log destinations are not allowed in the free-first profile"
                      )

              traces = obs.get("traces")
              if not isinstance(traces, dict) or traces.get("enabled") is not True:
                  errors.append(f"{prefix}: traces must be enabled")
              else:
                  if traces.get("persist") is not True:
                      errors.append(f"{prefix}: traces.persist must be true")
                  trace_rate = as_rate(traces.get("head_sampling_rate"), 1)
                  if not 0 <= trace_rate <= MAX_TRACE_SAMPLE:
                      errors.append(
                          f"{prefix}: traces.head_sampling_rate={trace_rate} exceeds {MAX_TRACE_SAMPLE}"
                      )
                  if traces.get("destinations"):
                      errors.append(
                          f"{prefix}: external trace destinations are not allowed in the free-first profile"
                      )

              return errors

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          configs = [
              pathlib.Path(p)
              for p in tracked
              if pathlib.Path(p).name.startswith("wrangler")
              and pathlib.Path(p).suffix == ".jsonc"
          ]

          if not configs:
              print("No tracked Wrangler JSONC configuration found.")
              sys.exit(0)

          errors = []
          for path in configs:
              try:
                  config = json.loads(strip_jsonc(path.read_text(encoding="utf-8")))
                  errors.extend(
                      check_observability(path, "production", config.get("observability"))
                  )

                  for env_name, env_config in (config.get("env") or {}).items():
                      if isinstance(env_config, dict) and "observability" in env_config:
                          errors.extend(
                              check_observability(
                                  path,
                                  f"env.{env_name}",
                                  env_config.get("observability"),
                              )
                          )
              except Exception as exc:
                  errors.append(f"{path}: cannot validate observability policy: {exc}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print(
              f"Cloudflare observability cost guardrails passed for {len(configs)} config(s): "
              f"logs <= {MAX_LOG_SAMPLE:.0%}, traces <= {MAX_TRACE_SAMPLE:.0%}."
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate Cloudflare projects
        shell: bash
        run: |
          set -euo pipefail

          validate_locked() {
            local dir="$1"
            (
              cd "$dir"
              npm ci --ignore-scripts --no-audit --no-fund
              npx wrangler deploy --dry-run
            )
          }

          validate_unlocked() {
            local dir="$1"
            (
              cd "$dir"
              npm install --ignore-scripts --no-audit --no-fund
              npx wrangler deploy --dry-run
            )
          }

          case "$GITHUB_REPOSITORY" in
            Avkroken/.github)
              echo "Source workflow repository; no Cloudflare profile required."
              ;;

            Avkroken/Klarsprak)
              validate_unlocked .
              ;;

            Avkroken/Dumpen)
              validate_locked .
              ;;

            Avkroken/Skvallerbyttan)
              validate_locked .
              ;;

            Avkroken/Krosa-Maja)
              npm ci --ignore-scripts --no-audit --no-fund
              npm run validate:worker
              ;;

            Avkroken/Politiker)
              validate_locked app
              ;;

            Avkroken/Produkter)
              validate_locked cloudflare/app
              validate_locked cloudflare/engine
              validate_locked cloudflare/processor
              ;;

            Avkroken/Jobb)
              corepack enable
              corepack prepare pnpm@10.17.1 --activate
              pnpm install --frozen-lockfile
              pnpm --filter @avkroken/web exec wrangler deploy --dry-run --config ../../wrangler.jsonc
              ;;

            *)
              echo "::error::No Cloudflare CI profile configured for $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac
