name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require dependency-free community repository
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' \) | grep -q .; then
            echo "::error::.github must not contain application dependencies."
            exit 1
          fi

  portal:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate community-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'community/profile' README.md
          test ! -e portal
          test ! -e docs
          test ! -e assets
