name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'dev' ||
      github.event.pull_request.draft == false
    name: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 'CI / admission' || 'CI / required' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          ruby -e 'require "psych"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |file| Psych.parse_file(file) }'

      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find .github -type f -name '*.sh' -print0)

      - name: Reject conflict markers and whitespace errors
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)'; then
            echo 'Unresolved conflict marker found.' >&2
            exit 1
          fi
          git diff --check "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"...HEAD

      - name: Verify deterministic classifier contract
        shell: bash
        run: |
          test -f .github/workflows/issue-classification.lock.yml
          test ! -e .github/workflows/issue-classification.md
          grep -Fq 'name: Deterministic issue classification' .github/workflows/issue-classification.lock.yml
          ! grep -Fq 'uses: github/gh-aw/.github/workflows/agentic-workflow.yml@' .github/workflows/issue-classification.lock.yml
          ! grep -Fq 'copilot-requests:' .github/workflows/issue-classification.lock.yml
          ! grep -Fq 'COPILOT_GITHUB_TOKEN' .github/workflows/issue-classification.lock.yml
