name: Docker

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker builds
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            Avkroken/.github)
              echo "Source workflow repository; no Docker CI profile required."
              ;;

            Avkroken/Docker-idempotent-update)
              docker build --pull -t avkroken/docker-idempotent-update-ci plex-clear-watchlist
              ;;

            Avkroken/Produkter)
              docker build --pull -t avkroken/produkter-app-ci .
              docker build --pull -t avkroken/produkter-scraper-ci scraper
              ;;

            Avkroken/Politiker)
              docker compose -f kontakter/docker-compose.yml build --pull
              ;;

            *)
              echo "::error::No Docker CI profile configured for $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac

      # Keep reporting and blocking aligned. The previous Produkter workflow
      # uploaded unfixed LOW/MEDIUM findings to Code Scanning while only
      # blocking fixable HIGH/CRITICAL findings, which produced green CI runs
      # alongside remediation issues such as Produkter #502.
      - name: Scan Produkter app for actionable findings
        if: ${{ github.repository == 'Avkroken/Produkter' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: avkroken/produkter-app-ci
          scanners: vuln,secret
          format: sarif
          output: trivy-app.sarif
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Produkter app findings
        if: ${{ always() && github.repository == 'Avkroken/Produkter' && github.event_name != 'merge_group' && hashFiles('trivy-app.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # releases/v4 2026-09-17
        with:
          sarif_file: trivy-app.sarif
          category: trivy-product-describer

      - name: Scan Produkter scraper for actionable findings
        if: ${{ github.repository == 'Avkroken/Produkter' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: avkroken/produkter-scraper-ci
          scanners: vuln,secret
          format: sarif
          output: trivy-scraper.sarif
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Produkter scraper findings
        if: ${{ always() && github.repository == 'Avkroken/Produkter' && github.event_name != 'merge_group' && hashFiles('trivy-scraper.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # releases/v4 2026-09-17
        with:
          sarif_file: trivy-scraper.sarif
          category: trivy-scraper

      - name: Gate Produkter app MEDIUM/HIGH/CRITICAL findings
        if: ${{ github.repository == 'Avkroken/Produkter' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: avkroken/produkter-app-ci
          scanners: vuln,secret
          format: table
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

      - name: Gate Produkter scraper MEDIUM/HIGH/CRITICAL findings
        if: ${{ github.repository == 'Avkroken/Produkter' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: avkroken/produkter-scraper-ci
          scanners: vuln,secret
          format: table
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
