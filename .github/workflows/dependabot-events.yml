name: Dependabot queue events

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  queue:
    uses: ./.github/workflows/dependabot-automerge.yml
    with:
      app-client-id: ${{ vars.GAMNACKEN_ID }}
    secrets:
      app-private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
