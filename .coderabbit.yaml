    custom: []
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 100
    title:
      mode: error
      requirements: |-
        Titeln ska följa repositoryts Conventional Commits-regel: feat|fix|perf|refactor|docs|test|build|ci|chore|revert, valfri scope, valfritt ! och en konkret beskrivning efter kolon.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks: []
