# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: sv
inheritance: true

reviews:
  # CodeRabbit saknar för närvarande Pull requests: write för den här installationen.
  # Behåll enforcement via checks utan att begära ytterligare skrivbehörigheter.
  request_changes_workflow: false
  path_instructions:
    - path: ".github/workflows/**"
      instructions: |
        Granska GitHub Actions utifrån minsta möjliga behörighet, säkert val av event,
        pinnade/kontrollerade externa actions, concurrency-beteende, artifact-gränser,
        fork-säkerhet och överensstämmelse med repository-ägda release-/deploymentkontrakt.
        Inför inte pull_request_target om ett dokumenterat krav inte kan uppfyllas säkert
        med pull_request eller ett annat event med lägre risk.
    - path: ".github/scripts/**"
      instructions: |
        Behandla release-/checkscript som repository-governance-kod.
        Granska tag ancestry, race conditions, registrering/settling av checks, pagination,
        timeout-budgetar, parsning av Conventional Commits och fail-closed-publicering.
    - path: "docs/**"
      instructions: |
        Begränsa det här repositoryt till delad/publik GitHub-kontext.
        Flytta inte repository-specifik teknisk current-state eller privata operativa
        detaljer hit; kanonisk teknisk state stannar i respektive repository.
    - path: "profile/**"
      instructions: |
        Behandla profilinnehåll som publik kontometadata.
        Flagga privata infrastrukturdetaljer, credentials, privata hostinventeringar
        eller påståenden om live repository-/provider-state som inte har stöd här.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 100

code_generation:
  docstrings:
    language: sv
    path_instructions:
      - path: ".github/scripts/**/*.py"
        instructions: |
          Använd koncisa Python-docstrings för icke-triviala funktioner.
          Använd Google-style-sektionerna Args, Returns och Raises när de tillför information.
          Dokumentera sidoeffekter från GitHub API/processer, tag-/checksemantik,
          timeout-beteende, antaganden för releasesäkerhet och fail-closed-villkor.
      - path: ".github/scripts/**/*.{js,mjs}"
        instructions: |
          Använd JSDoc för icke-triviala återanvändbara funktioner.
          Dokumentera GitHub-/API-sidoeffekter, miljövariabler, felbeteende
          samt varje repository-mutation eller publiceringsgräns.
      - path: "**/*test*.py"
        instructions: |
          Håll test-docstrings koncisa och beskriv den governance-/release-regression
          eller feltyp som testet skyddar mot.
  unit_tests:
    path_instructions:
      - path: ".github/scripts/**/*.py"
        instructions: |
          Föredra deterministiska enhetstester för parsning av Conventional Commits/trailers,
          tag ancestry och target selection, pagination, duplicerade check-identiteter,
          failed/pending checks, timeout-gränser och samtidig tag creation.
      - path: ".github/workflows/**"
        instructions: |
          Föredra source-contract-tester för permissions, triggers, concurrency,
          required checks, release targets och repository-ägda workflow-beteenden.
