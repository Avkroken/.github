# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: sv
tone_instructions: |-
  Svara på svenska. Var teknisk, saklig och koncis. Prioritera korrekthet, säkerhet, regressionsrisk, testbarhet och repositoryts dokumenterade kontrakt. Undvik skämt, dikter och utfyllnad.
early_access: false
enable_free_tier: true
inheritance: true
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |-
    Sammanfatta syfte, beteendeförändring, säkerhets- eller behörighetseffekt, tester/verifiering och dokumentationspåverkan. Skilj verifierade fakta från antaganden och hitta inte på saknade resultat.
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: |-
    Följ Conventional Commits-formatet som repositoryt kräver: feat|fix|perf|refactor|docs|test|build|ci|chore|revert, valfri scope, valfritt ! och därefter en kort svensk beskrivning.
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  labeling_instructions: []
  mutually_exclusive_groups: {}
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters: []
  path_instructions:
  - path: .github/workflows/**
    instructions: |-
      Granska GitHub Actions utifrån minsta möjliga behörighet, säkra events, pinnade externa actions, concurrency, artifact-gränser, fork-säkerhet och repositoryts release-/deploymentkontrakt. pull_request_target får bara användas när behovet är dokumenterat och implementationen inte exponerar privilegier för otillförlitlig kod.
  - path: .github/scripts/**/*.py
    instructions: |-
      Behandla release- och checkscript som governance-kod. Granska taggars härkomst, samtidighetsfel, API-pagination, check-registrering och stabilisering, timeout-budgetar, Conventional Commit-parsning, felhantering och fail-closed-beteende.
  - path: docs-portal/**/*.py
    instructions: |-
      Skydda principen att portalen är en genererad lässpegel och att respektive repo är kanonisk källa. Granska repoidentifiering, filtrering av privat eller otillåtet innehåll, länkrewrites, sökindex, nätverks- och filsystemsidoeffekter samt deterministiska tester.
  - path: scripts/**/*.js
    instructions: |-
      Behandla skript som skyddar den publika repositorygränsen som säkerhetskritiska. Granska fail-closed-beteende, sökvägar, filsystemskontroller och risken att privat eller repository-specifik intern kontext kan publiceras.
  - path: '*.md'
    instructions: |-
      Behandla root-dokumentation som publik organisationsgemensam GitHub-kontext. Flagga autentiseringsuppgifter, personuppgifter, privata hostinventeringar, intern driftdata och repo-specifik aktuell teknisk status som hör hemma i respektive repository.
  - path: profile/**
    instructions: |-
      Behandla profilinnehåll som publik kontometadata. Kontrollera att påståenden om aktuell provider- eller repo-status är källbundna och att privata operativa detaljer eller autentiseringsuppgifter inte exponeras.
  - path: CODEOWNERS
    instructions: |-
      Granska ändringar av ägarskap som governance. Säkerställ minsta nödvändiga omfattning och att kritiska sökvägar inte tappar avsedd ägare utan dokumenterat skäl.
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
  auto_review:
    enabled: true
    description_keyword: ''
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []
  finishing_touches:
