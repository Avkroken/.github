# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  # CodeRabbit currently lacks Pull requests: write on this installation.
  # Keep docstring enforcement on CodeRabbit's check surface without requesting writes.
  request_changes_workflow: false
  finishing_touches:
    docstrings:
      enabled: true
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: error
      threshold: 100
