code_generation:
  docstrings:
    language: sv
    path_instructions:
    - path: .github/scripts/**/*.py
      instructions: |-
        Skriv svenska, koncisa docstrings för icke-triviala funktioner. Använd Google-style Args, Returns och Raises när de tillför faktisk information. Dokumentera GitHub API- och subprocess-sidoeffekter, filskrivning, timeout- och felbeteende, release-/checksemantik samt fail-closed-villkor.
    - path: docs-portal/**/*.py
      instructions: |-
        Skriv svenska docstrings som beskriver funktionens kontrakt, input/output och relevanta nätverks- eller filsystemsidoeffekter. Dokumentera särskilt principen om kanonisk källa, publiceringsgränser, filtrering, länkrewrites, sökindex och felbeteende när funktionen ansvarar för dessa.
    - path: scripts/**/*.js
      instructions: |-
        Använd svensk JSDoc för icke-triviala återanvändbara funktioner. Beskriv repositorygränser, filsystemsidoeffekter, felbeteende och säkerhetsinvarianter. Dokumentera inte trivial top-level-kod enbart för att öka täckningen.
    - path: '**/*test*.py'
      instructions: |-
        Använd korta svenska test-docstrings endast när testets avsikt inte framgår tydligt av namnet. Beskriv regressionen eller invarianten som skyddas, inte rad-för-rad-mekaniken.
  unit_tests:
    path_instructions:
    - path: .github/scripts/**/*.py
      instructions: |-
        Föredra deterministiska tester för Conventional Commit- och trailerparsning, taggars härkomst och val av mål, pagination, duplicerade checkidentiteter, misslyckade/pågående checks, timeout-gränser och samtidig taggskapning. Mocka GitHub API, subprocess och tid där det behövs; gör inga live-mutationer.
    - path: docs-portal/**/*.py
      instructions: |-
        Föredra deterministiska tester med temporära kataloger och mockade nätverksanrop. Täck repoidentifiering, filtrering av publikt/privat innehåll, symlink-säkerhet, länkrewrites, kanoniska URL:er, sökindex och felhantering.
    - path: scripts/**/*.js
      instructions: |-
        Använd Node.js inbyggda testverktyg när nya tester behövs och undvik nya beroenden. Täck obligatoriska/förbjudna sökvägar, fail-closed-beteende och gränsfall för repositorygränsen utan att skriva utanför temporära testkataloger.
